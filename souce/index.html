<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Doto Parametric Editor - Final Rendering Fix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doto:ROND,wght@0..100,100..900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #0a0a0a; --panel: #161616; --accent: #00ff41;
            /* 制御用変数 */
            --f-rond: 100; --f-wght: 400; --f-spacing: 0px;
            --f-skew: 0deg; --f-scaleX: 1; --f-scaleY: 1;
            --f-color: hsl(140, 100%, 50%);
        }
        body { background: var(--bg); color: #eee; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; padding-bottom: 50px; }
        
        .viewport {
            width: 100%; height: 350px; background: #000; display: flex; justify-content: center; 
            align-items: center; overflow: hidden; border-bottom: 2px solid #222;
        }
        
        /* 共通のレンダリングクラス */
        .doto-render {
            font-family: 'Doto', sans-serif;
            font-variation-settings: "ROND" var(--f-rond), "wght" var(--f-wght);
            letter-spacing: var(--f-spacing);
            color: var(--f-color);
            transform: scale(var(--f-scaleX), var(--f-scaleY)) skewX(var(--f-skew));
            white-space: nowrap;
            line-height: 1;
            display: inline-block;
        }

        #text-layer { font-size: 150px; }

        .toolbar { width: 95%; max-width: 1000px; margin: 20px 0; display: flex; gap: 10px; }
        button { background: #333; color: white; border: 1px solid #444; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-size: 13px; font-weight: bold; }
        button:hover { border-color: var(--accent); }
        .btn-save { background: #00441b; color: #afffaf; }
        
        .main-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 95%; max-width: 1000px; }
        .section { background: var(--panel); padding: 20px; border-radius: 12px; border: 1px solid #333; }
        h3 { margin: 0 0 15px 0; font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid #333; padding-bottom: 8px; }
        
        .row { margin-bottom: 18px; }
        .label-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 6px; color: #aaa; }
        input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
        .val { color: var(--accent); font-family: monospace; }
        
        input[type="text"] { background: #000; color: var(--accent); border: 1px solid #333; padding: 10px; flex-grow: 1; outline: none; }

        #glyph-overlay { 
            display:none; position:fixed; top:0; left:0; width:100%; height:100%; 
            background:rgba(0,0,0,0.98); z-index:1000; overflow-y:auto; padding:40px; 
        }
        .glyph-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:20px; }
        .glyph-item { background:#111; padding:30px 10px; text-align:center; border-radius:8px; border:1px solid #222; }
        .glyph-char { font-size: 60px; }
    </style>
</head>
<body>

    <div class="viewport">
        <div id="text-layer" class="doto-render">GHOSTINKOMA</div>
    </div>

    <div class="toolbar">
        <button class="btn-save" onclick="saveParams()">保存 (.prm)</button>
        <button onclick="document.getElementById('file-input').click()">読込</button>
        <input type="file" id="file-input" style="display:none" onchange="loadParams(event)">
        <button onclick="toggleGlyphs()">全グリフ表示</button>
        <input type="text" id="custom-text" placeholder="INPUT TEXT" oninput="updateText(this.value)">
    </div>

    <div class="main-container">
        <div class="section">
            <h3>Geometry & Spacing</h3>
            <div class="row">
                <div class="label-row"><span>丸み (ROND)</span><span class="val" id="v-rond">100</span></div>
                <input type="range" id="p-rond" min="0" max="100" value="100">
            </div>
            <div class="row">
                <div class="label-row"><span>太さ (wght)</span><span class="val" id="v-wght">400</span></div>
                <input type="range" id="p-wght" min="100" max="900" value="400">
            </div>
            <div class="row">
                <div class="label-row"><span>字間 (Spacing)</span><span class="val" id="v-spacing">0</span></div>
                <input type="range" id="p-spacing" min="-50" max="100" value="0">
            </div>
            <div class="row">
                <div class="label-row"><span>イタリック角</span><span class="val" id="v-skew">0</span></div>
                <input type="range" id="p-skew" min="-45" max="45" value="0">
            </div>
            <div class="row">
                <div class="label-row"><span>スケール X / Y</span></div>
                <div style="display:flex; gap:10px;">
                    <input type="range" id="p-scaleX" min="0.5" max="3" step="0.1" value="1.0">
                    <input type="range" id="p-scaleY" min="0.5" max="3" step="0.1" value="1.0">
                </div>
            </div>
        </div>

        <div class="section">
            <h3>Color</h3>
            <div class="row"><div class="label-row"><span>Hue</span><span class="val" id="v-hue">140</span></div><input type="range" id="p-hue" min="0" max="360" value="140"></div>
            <div class="row"><div class="label-row"><span>Sat</span><span class="val" id="v-sat">100</span></div><input type="range" id="p-sat" min="0" max="100" value="100"></div>
            <div class="row"><div class="label-row"><span>Light</span><span class="val" id="v-light">50</span></div><input type="range" id="p-light" min="0" max="100" value="50"></div>
        </div>
    </div>

    <div id="glyph-overlay" onclick="this.style.display='none'"></div>

    <script>
        const root = document.documentElement;
        const params = ['rond', 'wght', 'spacing', 'skew', 'scaleX', 'scaleY', 'hue', 'sat', 'light'];

        function update() {
            const v = {};
            params.forEach(p => {
                v[p] = document.getElementById('p-' + p).value;
                const d = document.getElementById('v-' + p);
                if (d) d.innerText = v[p];
            });

            // CSS変数を一括更新
            root.style.setProperty('--f-rond', v.rond);
            root.style.setProperty('--f-wght', v.wght);
            root.style.setProperty('--f-spacing', v.spacing + 'px');
            root.style.setProperty('--f-skew', (-v.skew) + 'deg');
            root.style.setProperty('--f-scaleX', v.scaleX);
            root.style.setProperty('--f-scaleY', v.scaleY);
            root.style.setProperty('--f-color', `hsl(${v.hue}, ${v.sat}%, ${v.light}%)`);
        }

        function updateText(t) { document.getElementById('text-layer').innerText = t || "GHOSTINKOMA"; }

        function saveParams() {
            const config = {};
            params.forEach(p => config[p] = document.getElementById('p-' + p).value);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' }));
            a.download = 'doto_config.prm'; a.click();
        }

        function loadParams(e) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const config = JSON.parse(ev.target.result);
                for (let p in config) {
                    const el = document.getElementById('p-' + p);
                    if (el) el.value = config[p];
                }
                update();
            };
            reader.readAsText(e.target.files[0]);
        }

        function toggleGlyphs() {
            const overlay = document.getElementById('glyph-overlay');
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;':\",./<>?";
            
            let html = `<div style="color:var(--accent); font-size:11px; margin-bottom:20px;">[ CLICK TO CLOSE ]</div><div class="glyph-grid">`;
            chars.split('').forEach(c => {
                // .doto-render クラスを付与するだけで共通のCSS変数が適用される
                html += `<div class="glyph-item"><span class="doto-render glyph-char">${c}</span></div>`;
            });
            html += `</div>`;
            
            overlay.innerHTML = html;
            overlay.style.display = 'block';
        }

        params.forEach(id => document.getElementById('p-' + id).addEventListener('input', update));
        update();
    </script>
</body>
</html>
